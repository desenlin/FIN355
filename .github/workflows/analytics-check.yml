name: Analytics tracking audit
on:
  push:
  pull_request:
  page_build:
  workflow_dispatch:
    inputs:
      live:
        description: Audit the deployed site as well as source coverage
        type: boolean
        default: true
  # Weekly live coverage runs in desenlin/desenlin.github.io so an inactive
  # teaching repository does not lose its scheduled checks after 60 days.
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: analytics-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    uses: desenlin/desenlin.github.io/.github/workflows/analytics-reusable.yml@main
    with:
      live: ${{ github.event_name == 'page_build' || github.event_name == 'workflow_run' || (github.event_name == 'workflow_dispatch' && inputs.live) }}
